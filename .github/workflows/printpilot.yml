name: PrintPilot
on:
  push:
    branches: [feat/ai-auto-setting]
    paths: ['services/printpilot/**', 'src/**', '.github/workflows/printpilot.yml']
  workflow_dispatch:
    inputs:
      native:
        description: Build Windows and macOS clients
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: printpilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s services/printpilot -p 'test_*.py' -v
      - run: python -m unittest discover -s services/printpilot/bridge -p 'test_*.py' -v
      - run: find services/printpilot/web -name '*.js' -exec node --check {} \;
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - uses: microsoft/setup-msbuild@v2
      - run: choco install strawberryperl pkgconfiglite nsis -y --no-progress
      - name: Dependencies
        run: |
          cmake -S deps -B deps/build -G "Visual Studio 17 2022" -A x64 -DDESTDIR="$pwd/deps/build/BambuStudio_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF
          cmake --build deps/build --config Release --parallel 3
      - name: Build and package
        run: |
          $sdk = (Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Include' -Directory | Where-Object Name -Match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1).FullName
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 -DCMAKE_PREFIX_PATH="$pwd/deps/build/BambuStudio_dep/usr/local" -DCMAKE_INSTALL_PREFIX="$pwd/install-dir" -DWIN10SDK_PATH="$sdk"
          cmake --build build --target install --config Release --parallel 3
          Compress-Archive -Path install-dir/* -DestinationPath PrintPilot-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PrintPilot-Windows-x64
          path: PrintPilot-Windows-x64.zip
          retention-days: 1
          if-no-files-found: error
  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          brew install automake texinfo nasm yasm ninja
          python -m pip install cmake==3.31.6
      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: ./BuildMac.sh -x -a arm64 -t 11.0
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/arm64/BambuStudio/BambuStudio.app PrintPilot-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PrintPilot-macOS-arm64
          path: PrintPilot-macOS-arm64.zip
          retention-days: 1
          if-no-files-found: error
